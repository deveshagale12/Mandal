<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganpati Mandal - User Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #fdf2f2; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .loader { border-top-color: #f97316; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .orange-gradient { background: linear-gradient(135deg, #f97316 0%, #dc2626 100%); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="glass w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-orange-100">
        <div class="orange-gradient p-8 text-center text-white">
            <i class="fa-solid fa-om text-4xl mb-2"></i>
            <h1 class="text-2xl font-bold">Ganpati Bappa Mandal</h1>
            <p class="text-orange-100 text-sm">Join our divine community</p>
        </div>

        <div class="p-8">
            <div class="flex mb-8 bg-orange-50 rounded-xl p-1">
                <button id="tabLogin" onclick="toggleAuth('login')" class="w-1/2 py-2 rounded-lg font-semibold text-orange-600 bg-white shadow-sm transition-all">Login</button>
                <button id="tabReg" onclick="toggleAuth('register')" class="w-1/2 py-2 rounded-lg font-semibold text-gray-500 transition-all">Register</button>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="loginEmail" required class="w-full mt-1 p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 outline-none transition-all" placeholder="Enter email">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="loginPass" required class="w-full mt-1 p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 outline-none transition-all" placeholder="••••••••">
                </div>
                <button type="submit" id="btnLogin" class="w-full orange-gradient text-white py-3 rounded-xl font-bold shadow-lg hover:opacity-90 transition-all flex items-center justify-center">
                    <span id="loginText">Sign In</span>
                    <div id="loginLoader" class="hidden loader w-5 h-5 border-2 border-white rounded-full ml-2"></div>
                </button>
                <p class="text-center text-sm text-gray-500">Forgot Password? <a href="#" onclick="forgotPassword()" class="text-orange-600 font-semibold">Reset here</a></p>
            </form>

            <form id="regForm" class="hidden space-y-3">
                <input type="text" id="regName" placeholder="Full Name" required class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-orange-500">
                <input type="email" id="regEmail" placeholder="Email" required class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-orange-500">
                <input type="text" id="regMobile" placeholder="Mobile Number" required class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-orange-500">
                <input type="text" id="regAddress" placeholder="Address" required class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-orange-500">
                <input type="date" id="regDob" required class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-orange-500">
                <input type="password" id="regPass" placeholder="Password" required class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-orange-500">
                
                <button type="submit" id="btnReg" class="w-full orange-gradient text-white py-3 rounded-xl font-bold shadow-lg hover:opacity-90 transition-all flex items-center justify-center">
                    <span id="regText">Register Now</span>
                    <div id="regLoader" class="hidden loader w-5 h-5 border-2 border-white rounded-full ml-2"></div>
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = "https://mandal.onrender.com/api/users"; // Change to Render URL after deployment

        function toggleAuth(type) {
            if (type === 'login') {
                $('#loginForm').removeClass('hidden');
                $('#regForm').addClass('hidden');
                $('#tabLogin').addClass('bg-white text-orange-600 shadow-sm').removeClass('text-gray-500');
                $('#tabReg').removeClass('bg-white text-orange-600 shadow-sm').addClass('text-gray-500');
            } else {
                $('#loginForm').addClass('hidden');
                $('#regForm').removeClass('hidden');
                $('#tabReg').addClass('bg-white text-orange-600 shadow-sm').removeClass('text-gray-500');
                $('#tabLogin').removeClass('bg-white text-orange-600 shadow-sm').addClass('text-gray-500');
            }
        }

        // --- LOGIN LOGIC ---
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();
            const data = { email: $('#loginEmail').val(), password: $('#loginPass').val() };
            
            toggleLoader('login', true);

            $.ajax({
                url: `${API_BASE}/login`,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    Swal.fire('Success', 'Welcome to the Mandal!', 'success').then(() => {
                        window.location.href = 'userdash.html';
                    });
                },
                error: function(err) {
                    Swal.fire('Error', err.responseJSON.message || 'Login Failed', 'error');
                },
                complete: () => toggleLoader('login', false)
            });
        });

        // --- REGISTRATION LOGIC ---
        $('#regForm').on('submit', function(e) {
            e.preventDefault();
            const data = {
                name: $('#regName').val(),
                email: $('#regEmail').val(),
                mobileNo: $('#regMobile').val(),
                address: $('#regAddress').val(),
                dob: $('#regDob').val(),
                password: $('#regPass').val()
            };

            toggleLoader('reg', true);

            $.ajax({
                url: `${API_BASE}/register`,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function() {
                    Swal.fire('Registered!', 'You can now login.', 'success');
                    toggleAuth('login');
                },
                error: function(err) {
                    Swal.fire('Failed', err.responseJSON.message || 'Registration Error', 'error');
                },
                complete: () => toggleLoader('reg', false)
            });
        });

        function forgotPassword() {
            Swal.fire({
                title: 'Forgot Password',
                input: 'email',
                inputLabel: 'Your Registered Email',
                showCancelButton: true,
                confirmButtonColor: '#f97316'
            }).then((result) => {
                if (result.value) {
                    Swal.fire('Sent!', 'Password reset link sent to email.', 'info');
                }
            });
        }

        function toggleLoader(type, isLoading) {
            if (isLoading) {
                $(`#${type}Text`).addClass('hidden');
                $(`#${type}Loader`).removeClass('hidden');
                $(`#btn${type === 'login' ? 'Login' : 'Reg'}`).attr('disabled', true);
            } else {
                $(`#${type}Text`).removeClass('hidden');
                $(`#${type}Loader`).addClass('hidden');
                $(`#btn${type === 'login' ? 'Login' : 'Reg'}`).attr('disabled', false);
            }
        }
    </script>
</body>
</html>
